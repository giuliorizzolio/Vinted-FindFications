# Aggiorna lo stack Portainer esistente; NON crearne un secondo.
# Definisci APIFY_TOKEN nella sezione Environment variables dello stack.
services:
  vinted-notifications:
    image: ghcr.io/giuliorizzolio/vinted-findfications:catalogo
    pull_policy: always
    ports:
      - "8001:8000"
      - "8081:8080"
    environment:
      APIFY_TOKEN: "${APIFY_TOKEN:-}"
      # False = solo ricerche manuali. True = monitor automatico a pagamento.
      APIFY_AUTO_ENABLED: "${APIFY_AUTO_ENABLED:-false}"
    volumes:
      - VN_data:/app/data
      - VN_logs:/app/logs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
volumes:
  VN_data:
  VN_logs:
