name: Lint & Dependency Audit

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed_catalog:
    name: Catalog code checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install ruff black
      - name: Ruff new modules
        run: ruff check catalog_search.py web_ui_plugin/catalog_routes.py --select E4,E7,E9,F --ignore E501
      - name: Syntax
        run: python -m compileall -q catalog_search.py web_ui_plugin/catalog_routes.py

  dependency_audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt

  legacy_quality_report:
    name: Legacy code quality (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff black
      - name: Ruff entire inherited codebase
        run: ruff check .
      - name: Black entire codebase and new modules (informational)
        if: always()
        run: black --check .
